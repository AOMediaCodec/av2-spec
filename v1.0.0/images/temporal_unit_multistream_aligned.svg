  <text x="575" y="265" font-family="Arial, sans-serif" font-size="10" fill="#666">. . .</text>

  <text x="230" y="307" font-family="Arial, sans-serif" font-size="7" fill="#555" font-style="italic">Format: [xId:mId] — all share same OrderHint within this local temporal unit</text>

