  <text x="212" y="167" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">LCR</text>

  <rect x="250" y="145" width="55" height="28" fill="#ab47bc" stroke="#7b1fa2" stroke-width="1" rx="2"/>
  <text x="277" y="157" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Global</text>
  <text x="277" y="167" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">OPS</text>

  <rect x="315" y="145" width="55" height="28" fill="#8d6e63" stroke="#5d4037" stroke-width="1" rx="2"/>
