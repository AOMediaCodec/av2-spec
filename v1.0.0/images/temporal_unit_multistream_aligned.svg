  <rect x="230" y="393" width="70" height="25" fill="#ffa726" stroke="#f57c00" stroke-width="1" rx="2"/>
  <text x="265" y="409" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Non-out [1:0]</text>

  <rect x="310" y="393" width="70" height="25" fill="#e65100" stroke="#bf360c" stroke-width="1.5" rx="2"/>
  <text x="345" y="409" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" font-weight="bold">Output [1:0]</text>

  <rect x="400" y="393" width="70" height="25" fill="#ffa726" stroke="#f57c00" stroke-width="1" rx="2"/>
  <text x="435" y="409" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Non-out [1:1]</text>

  <rect x="480" y="393" width="70" height="25" fill="#e65100" stroke="#bf360c" stroke-width="1.5" rx="2"/>
  <text x="515" y="409" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" font-weight="bold">Output [1:1]</text>

  <text x="575" y="410" font-family="Arial, sans-serif" font-size="10" fill="#666">. . .</text>

  <text x="230" y="452" font-family="Arial, sans-serif" font-size="7" fill="#555" font-style="italic">All output frames share same OrderHint as Extended Layer 0 (temporally aligned)</text>

  <!-- Ascending order annotation -->
  <line x1="25" y1="195" x2="25" y2="478" stroke="#0d47a1" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="15" y="340" font-family="Arial, sans-serif" font-size="9" fill="#0d47a1" transform="rotate(-90, 15, 340)" text-anchor="middle">ascending obu_xlayer_id</text>

  <!-- Constraints box at bottom -->
  <rect x="20" y="620" width="1060" height="50" fill="#fff8e1" stroke="#ffa000" stroke-width="1" rx="3"/>
  <text x="35" y="637" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#e65100">Alignment constraints:</text>
  <text x="35" y="652" font-family="Arial, sans-serif" font-size="8" fill="#333">• All extended layers: same coding/display order, same OrderHintBits, same OrderHint for aligned frames, same output schedule if buffer removal timing present</text>
  <text x="35" y="665" font-family="Arial, sans-serif" font-size="8" fill="#333">• Extended layers appear in ascending order of obu_xlayer_id</text>
</svg>
