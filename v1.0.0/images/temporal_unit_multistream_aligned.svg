  <text x="135" y="388" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">SH</text>
  <text x="135" y="398" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[1]</text>

  <rect x="165" y="375" width="40" height="28" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="2" stroke-dasharray="4,2"/>
  <text x="185" y="388" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">OPS</text>
  <text x="185" y="398" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[1]</text>

  <text x="115" y="415" font-family="Arial, sans-serif" font-size="6" text-anchor="start" fill="#666">(if not front-loaded)</text>

