<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <!-- Title -->
  <text x="500" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Singlestream Bitstream — Local Temporal Unit Structure
  </text>

  <!-- Legend -->
  <g id="legend">
    <rect x="20" y="40" width="960" height="50" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <text x="30" y="60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Legend:</text>

    <rect x="30" y="68" width="40" height="16" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
    <text x="75" y="80" font-family="Arial, sans-serif" font-size="9" fill="#333">TD</text>

    <rect x="110" y="68" width="40" height="16" fill="#5c6bc0" stroke="#3949ab" stroke-width="1" rx="2"/>
    <text x="155" y="80" font-family="Arial, sans-serif" font-size="9" fill="#333">LCR</text>

    <rect x="210" y="68" width="40" height="16" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="2"/>
    <text x="255" y="80" font-family="Arial, sans-serif" font-size="9" fill="#333">OPS</text>

    <rect x="305" y="68" width="40" height="16" fill="#ab47bc" stroke="#7b1fa2" stroke-width="1" rx="2"/>
    <text x="350" y="80" font-family="Arial, sans-serif" font-size="9" fill="#333">Atlas</text>

    <rect x="405" y="68" width="40" height="16" fill="#26a69a" stroke="#00897b" stroke-width="1" rx="2"/>
    <text x="450" y="80" font-family="Arial, sans-serif" font-size="9" fill="#333">SH</text>

    <rect x="500" y="68" width="40" height="16" fill="#66bb6a" stroke="#388e3c" stroke-width="1" rx="2"/>
    <text x="545" y="80" font-family="Arial, sans-serif" font-size="9" fill="#333">Non-output frame</text>

    <rect x="660" y="68" width="40" height="16" fill="#2e7d32" stroke="#1b5e20" stroke-width="1" rx="2"/>
    <text x="705" y="80" font-family="Arial, sans-serif" font-size="9" fill="#333">Output frame</text>

    <rect x="815" y="68" width="40" height="16" fill="#e0e0e0" stroke="#999" stroke-width="1" rx="2"/>
    <text x="860" y="80" font-family="Arial, sans-serif" font-size="9" fill="#333">Padding/Metadata</text>
  </g>

  <!-- Outer bounding box: Local Temporal Unit -->
  <rect x="20" y="105" width="960" height="295" fill="none" stroke="#1565c0" stroke-width="2.5" rx="6" stroke-dasharray="8,4"/>
  <text x="30" y="125" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">
    Local Temporal Unit (obu_xlayer_id = X)
  </text>

  <!-- TD -->
  <rect x="40" y="140" width="50" height="30" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="3"/>
  <text x="65" y="159" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" font-weight="bold">TD</text>
  <text x="65" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#666">(optional)</text>

  <!-- LCR -->
  <rect x="105" y="140" width="50" height="30" fill="#5c6bc0" stroke="#3949ab" stroke-width="1" rx="3"/>
  <text x="130" y="159" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" font-weight="bold">LCR</text>
  <text x="130" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#666">(0 or more)</text>

  <!-- OPS -->
  <rect x="170" y="140" width="50" height="30" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="3"/>
  <text x="195" y="159" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" font-weight="bold">OPS</text>
  <text x="195" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#666">(0 or more)</text>

  <!-- Atlas -->
  <rect x="235" y="140" width="55" height="30" fill="#ab47bc" stroke="#7b1fa2" stroke-width="1" rx="3"/>
  <text x="262" y="159" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" font-weight="bold">Atlas</text>
  <text x="262" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#666">(0 or more)</text>

  <!-- SH -->
  <rect x="305" y="140" width="50" height="30" fill="#26a69a" stroke="#00897b" stroke-width="1" rx="3"/>
  <text x="330" y="159" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white" font-weight="bold">SH</text>
  <text x="330" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#666">(0 or more)</text>

  <!-- Arrow -->
  <line x1="370" y1="155" x2="395" y2="155" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Embedded layers box -->
  <rect x="400" y="105" width="560" height="285" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5" rx="4"/>
  <text x="410" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2e7d32">
    Coded frame Units (per embedded layer, ascending obu_mlayer_id)
  </text>

  <!-- Embedded Layer 0 -->
  <rect x="415" y="135" width="530" height="70" fill="#f1f8e9" stroke="#66bb6a" stroke-width="1" rx="3"/>
  <text x="425" y="152" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#33691e">Embedded Layer 0 (obu_mlayer_id = 0)</text>

  <rect x="425" y="160" width="80" height="28" fill="#66bb6a" stroke="#388e3c" stroke-width="1" rx="2"/>
  <text x="465" y="172" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Non-output</text>
  <text x="465" y="182" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">frame 0</text>

  <rect x="515" y="160" width="80" height="28" fill="#66bb6a" stroke="#388e3c" stroke-width="1" rx="2"/>
  <text x="555" y="172" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Non-output</text>
  <text x="555" y="182" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">frame 1</text>

  <rect x="610" y="160" width="80" height="28" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5" rx="2"/>
  <text x="650" y="172" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white" font-weight="bold">Output</text>
  <text x="650" y="182" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white" font-weight="bold">frame</text>

  <!-- Embedded Layer 1 -->
  <rect x="415" y="215" width="530" height="70" fill="#f1f8e9" stroke="#66bb6a" stroke-width="1" rx="3"/>
  <text x="425" y="232" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#33691e">Embedded Layer 1 (obu_mlayer_id = 1)</text>

  <rect x="425" y="240" width="80" height="28" fill="#66bb6a" stroke="#388e3c" stroke-width="1" rx="2"/>
  <text x="465" y="252" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Non-output</text>
  <text x="465" y="262" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">frame</text>

  <rect x="515" y="240" width="80" height="28" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5" rx="2"/>
  <text x="555" y="252" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white" font-weight="bold">Output</text>
  <text x="555" y="262" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white" font-weight="bold">frame</text>

  <!-- Ellipsis for more layers -->
  <text x="680" y="250" font-family="Arial, sans-serif" font-size="14" fill="#666">. . .</text>

  <!-- Constraint notes -->
  <rect x="415" y="295" width="530" height="85" fill="#fff8e1" stroke="#ffa000" stroke-width="1" rx="3"/>
  <text x="425" y="312" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#e65100">Constraints:</text>
  <text x="425" y="326" font-family="Arial, sans-serif" font-size="8" fill="#333">• At least one coded output frame unit shall be present</text>
  <text x="425" y="339" font-family="Arial, sans-serif" font-size="8" fill="#333">• All coded output frame units share the same value of OrderHint</text>
  <text x="425" y="352" font-family="Arial, sans-serif" font-size="8" fill="#333">• Cannot contain both OLK and CLK OBUs</text>
  <text x="425" y="365" font-family="Arial, sans-serif" font-size="8" fill="#333">• Global OBUs (obu_xlayer_id = 31) should not be present; if present, should be ignored</text>

</svg>
