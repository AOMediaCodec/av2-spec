<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600">
  <!-- Title -->
  <text x="400" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Multistream Bitstream Decoder Operation Modes
  </text>

  <!-- Input Bitstream -->
  <rect x="320" y="50" width="160" height="40" fill="#e8f4f8" stroke="#0066cc" stroke-width="2" rx="4"/>
  <text x="400" y="75" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    Multistream Bitstream
  </text>

  <!-- Arrow down -->
  <line x1="400" y1="90" x2="400" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Decision box -->
  <path d="M 400 120 L 480 160 L 400 200 L 320 160 Z" fill="#fff4e6" stroke="#ff9900" stroke-width="2"/>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    Decoder
  </text>
  <text x="400" y="170" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">
    Operation Mode?
  </text>

  <!-- Mode A: Full bitstream decoding -->
  <g id="mode-a">
    <line x1="320" y1="160" x2="140" y2="160" stroke="#666" stroke-width="2"/>
    <line x1="140" y1="160" x2="140" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

    <rect x="50" y="250" width="180" height="120" fill="#e8f5e9" stroke="#4caf50" stroke-width="2" rx="4"/>
    <text x="140" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">
      a) Full Bitstream
    </text>
    <text x="140" y="295" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2e7d32">
      Decoding
    </text>
    <text x="140" y="320" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
      Decode all extended layers
    </text>
    <text x="140" y="337" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
      based on MSDO/LCR
    </text>
    <text x="140" y="354" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
      and Sequence Headers
    </text>
  </g>

  <!-- Mode B: Per-layer operating point selection -->
  <g id="mode-b">
    <line x1="400" y1="200" x2="400" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

    <rect x="300" y="250" width="200" height="120" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="4"/>
    <text x="400" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">
      b) Per-Layer Operating
    </text>
    <text x="400" y="292" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">
      Point Selection
    </text>
    <text x="400" y="317" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
      Decode all extended layers,
    </text>
    <text x="400" y="334" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
      select local OPS per layer
    </text>
    <text x="400" y="351" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
      (refine embedded/temporal)
    </text>
  </g>

  <!-- Mode C: Global operating point selection -->
  <g id="mode-c">
    <line x1="480" y1="160" x2="660" y2="160" stroke="#666" stroke-width="2"/>
    <line x1="660" y1="160" x2="660" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

    <rect x="560" y="250" width="200" height="120" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2" rx="4"/>
    <text x="660" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#6a1b9a">
      c) Global Operating
    </text>
    <text x="660" y="292" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#6a1b9a">
      Point Selection
    </text>
    <text x="660" y="317" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
      Select global OPS
    </text>
    <text x="660" y="334" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
      (extended/embedded/
    </text>
    <text x="660" y="351" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
      temporal layers)
    </text>
  </g>

  <!-- Mode C branches -->
  <line x1="660" y1="370" x2="660" y2="400" stroke="#666" stroke-width="2"/>
  <line x1="660" y1="400" x2="580" y2="400" stroke="#666" stroke-width="2"/>
  <line x1="660" y1="400" x2="740" y2="400" stroke="#666" stroke-width="2"/>
  <line x1="580" y1="400" x2="580" y2="430" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="740" y1="400" x2="740" y2="430" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Mode C option a -->
  <rect x="510" y="430" width="140" height="80" fill="#ede7f6" stroke="#673ab7" stroke-width="1.5" rx="3"/>
  <text x="580" y="450" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4527a0">
    a) Extended layers
  </text>
  <text x="580" y="465" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4527a0">
    only
  </text>
  <text x="580" y="485" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
    Retain extended
  </text>
  <text x="580" y="500" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
    layers only
  </text>

  <!-- Mode C option b -->
  <rect x="670" y="430" width="140" height="80" fill="#ede7f6" stroke="#673ab7" stroke-width="1.5" rx="3"/>
  <text x="740" y="450" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4527a0">
    b) Complete layer
  </text>
  <text x="740" y="465" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4527a0">
    specification
  </text>
  <text x="740" y="485" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
    Full 3D extraction
  </text>
  <text x="740" y="500" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">
    (X/M/T layers)
  </text>

  <!-- Legend -->
  <text x="40" y="560" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#666">
    Legend:
  </text>
  <text x="40" y="580" font-family="Arial, sans-serif" font-size="10" fill="#666">
    X = Extended layer, M = Embedded layer, T = Temporal layer
  </text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
