<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="500" y="25" text-anchor="middle" font-size="16" font-weight="bold">Subpicture Composition - Video Conferencing Layout</text>

  <!-- Atlas Canvas -->
  <rect x="50" y="50" width="900" height="430" fill="#E8E8E8" stroke="#333" stroke-width="2"/>
  <text x="500" y="70" text-anchor="middle" font-size="12" fill="#666">Atlas Canvas: 1920 x 1080 pixels (virtual composite screen)</text>

  <!-- Segment 0: Main speaker (left, large) -->
  <g>
    <rect x="60" y="90" width="580" height="380" fill="#4A90E2" opacity="0.8" stroke="#2E5C8A" stroke-width="3"/>
    <text x="350" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Main Speaker</text>
    <text x="350" y="285" text-anchor="middle" font-size="12" fill="white">Extended Layer 0</text>
    <text x="350" y="305" text-anchor="middle" font-size="11" fill="white">Segment 0: atlas_segment_id = 0</text>
    <text x="350" y="323" text-anchor="middle" font-size="10" fill="white">Position: (0, 0)</text>
    <text x="350" y="338" text-anchor="middle" font-size="10" fill="white">Size: 1280 x 1080 pixels</text>
    <text x="350" y="353" text-anchor="middle" font-size="10" fill="white">High resolution, high bitrate</text>
  </g>

  <!-- Segment 1: Participant 2 (top right) -->
  <g>
    <rect x="660" y="90" width="280" height="185" fill="#81C784" opacity="0.8" stroke="#4CAF50" stroke-width="2"/>
    <text x="800" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Participant 2</text>
    <text x="800" y="185" text-anchor="middle" font-size="10" fill="white">Extended Layer 1</text>
    <text x="800" y="202" text-anchor="middle" font-size="9" fill="white">Segment 1: atlas_segment_id = 1</text>
    <text x="800" y="217" text-anchor="middle" font-size="9" fill="white">Position: (1280, 0)</text>
    <text x="800" y="231" text-anchor="middle" font-size="9" fill="white">Size: 640 x 540 pixels</text>
    <text x="800" y="245" text-anchor="middle" font-size="9" fill="white">Medium resolution</text>
  </g>

  <!-- Segment 2: Participant 3 (bottom right) -->
  <g>
    <rect x="660" y="285" width="280" height="185" fill="#FFB74D" opacity="0.8" stroke="#FF9800" stroke-width="2"/>
    <text x="800" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Participant 3</text>
    <text x="800" y="380" text-anchor="middle" font-size="10" fill="white">Extended Layer 2</text>
    <text x="800" y="397" text-anchor="middle" font-size="9" fill="white">Segment 2: atlas_segment_id = 2</text>
    <text x="800" y="412" text-anchor="middle" font-size="9" fill="white">Position: (1280, 540)</text>
    <text x="800" y="426" text-anchor="middle" font-size="9" fill="white">Size: 640 x 540 pixels</text>
    <text x="800" y="440" text-anchor="middle" font-size="9" fill="white">Medium resolution</text>
  </g>

  <!-- Dimension annotations -->
  <g>
    <!-- Horizontal dimension for main speaker -->
    <line x1="60" y1="485" x2="640" y2="485" stroke="#333" stroke-width="1" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
    <text x="350" y="500" text-anchor="middle" font-size="9">1280 px</text>

    <!-- Horizontal dimension for participants -->
    <line x1="660" y1="485" x2="940" y2="485" stroke="#333" stroke-width="1" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
    <text x="800" y="500" text-anchor="middle" font-size="9">640 px</text>

    <!-- Vertical dimension for participant 2 -->
    <line x1="955" y1="90" x2="955" y2="275" stroke="#333" stroke-width="1" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
    <text x="975" y="185" font-size="9">540 px</text>

    <!-- Vertical dimension for participant 3 -->
    <line x1="955" y1="285" x2="955" y2="470" stroke="#333" stroke-width="1" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>
    <text x="975" y="380" font-size="9">540 px</text>
  </g>

  <!-- Info boxes -->
  <g transform="translate(50, 505)">
    <text x="0" y="0" font-size="10" font-weight="bold">Benefits:</text>
    <text x="0" y="15" font-size="9">• Independent decoding - decode only visible participants</text>
    <text x="0" y="28" font-size="9">• Adaptive quality - different bitrates per participant</text>
    <text x="0" y="41" font-size="9">• Dynamic layout - atlas can be updated without re-encoding streams</text>

    <text x="450" y="0" font-size="10" font-weight="bold">Atlas Mode:</text>
    <text x="450" y="15" font-size="9">Mode 0 (Enhanced Atlas)</text>
    <text x="450" y="28" font-size="9">Global LCR references atlas_id = 0</text>
    <text x="450" y="41" font-size="9">Each layer has local LCR with segment association</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#333"/>
    </marker>
  </defs>
</svg>
