<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <!-- Title -->
  <text x="500" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Singlestream Sub-bitstream Extraction Example
  </text>

  <!-- Legend -->
  <g id="legend">
    <rect x="20" y="40" width="960" height="70" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <text x="30" y="60" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Legend:</text>

    <rect x="30" y="70" width="40" height="18" fill="#9e9e9e" stroke="#666" stroke-width="1"/>
    <text x="75" y="82" font-family="Arial, sans-serif" font-size="9" fill="#333">TD = Temporal Delimiter</text>

    <rect x="220" y="70" width="40" height="18" fill="#5c6bc0" stroke="#3949ab" stroke-width="1"/>
    <text x="265" y="82" font-family="Arial, sans-serif" font-size="9" fill="#333">LCR = Layer Config Record</text>

    <rect x="430" y="70" width="40" height="18" fill="#42a5f5" stroke="#1976d2" stroke-width="1"/>
    <text x="475" y="82" font-family="Arial, sans-serif" font-size="9" fill="#333">OPS = Operating Point Set</text>

    <rect x="660" y="70" width="40" height="18" fill="#26a69a" stroke="#00897b" stroke-width="1"/>
    <text x="705" y="82" font-family="Arial, sans-serif" font-size="9" fill="#333">SH = Sequence Header</text>

    <rect x="30" y="92" width="40" height="18" fill="#66bb6a" stroke="#388e3c" stroke-width="1"/>
    <text x="75" y="104" font-family="Arial, sans-serif" font-size="9" fill="#333">Frame (kept)</text>

    <rect x="220" y="92" width="40" height="18" fill="none" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="265" y="104" font-family="Arial, sans-serif" font-size="9" fill="#d32f2f">Frame (dropped)</text>

    <text x="380" y="104" font-family="Arial, sans-serif" font-size="9" fill="#333">
      Frame format: [mId:tId] where m=embedded, t=temporal layer (single xId=0)
    </text>
  </g>

  <!-- Input Bitstream -->
  <text x="20" y="150" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0d47a1">
    Input Singlestream Bitstream (single extended layer xId=0):
  </text>

  <!-- Temporal Unit 1 (tId=0) -->
  <g id="tu1-input">
    <text x="30" y="180" font-family="Arial, sans-serif" font-size="10" fill="#666">TU 1 (t=0):</text>

    <rect x="100" y="165" width="30" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
    <text x="115" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

    <rect x="135" y="165" width="38" height="24" fill="#5c6bc0" stroke="#3949ab" stroke-width="1" rx="2"/>
    <text x="154" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">LCR</text>

    <rect x="178" y="165" width="38" height="24" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="2"/>
    <text x="197" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">OPS</text>

    <rect x="221" y="165" width="35" height="24" fill="#26a69a" stroke="#00897b" stroke-width="1" rx="2"/>
    <text x="238" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">SH</text>

    <rect x="261" y="165" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="281" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[0:0]</text>

    <rect x="306" y="165" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="326" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[1:0]</text>

    <rect x="351" y="165" width="40" height="24" fill="#66bb6a" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,2" rx="2"/>
    <text x="371" y="180" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[2:0]</text>
  </g>

  <!-- Temporal Unit 2 (tId=1) -->
  <g id="tu2-input">
    <text x="30" y="215" font-family="Arial, sans-serif" font-size="10" fill="#666">TU 2 (t=1):</text>

    <rect x="100" y="200" width="30" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
    <text x="115" y="215" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

    <rect x="135" y="200" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="155" y="215" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[0:1]</text>

    <rect x="180" y="200" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="200" y="215" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[1:1]</text>

    <rect x="225" y="200" width="40" height="24" fill="#66bb6a" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,2" rx="2"/>
    <text x="245" y="215" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[2:1]</text>
  </g>

  <!-- Temporal Unit 3 (tId=2) -->
  <g id="tu3-input">
    <text x="30" y="250" font-family="Arial, sans-serif" font-size="10" fill="#666">TU 3 (t=2):</text>

    <rect x="100" y="235" width="30" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
    <text x="115" y="250" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

    <rect x="135" y="235" width="40" height="24" fill="#66bb6a" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,2" rx="2"/>
    <text x="155" y="250" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[0:2]</text>

    <rect x="180" y="235" width="40" height="24" fill="#66bb6a" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,2" rx="2"/>
    <text x="200" y="250" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[1:2]</text>

    <rect x="225" y="235" width="40" height="24" fill="#66bb6a" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,2" rx="2"/>
    <text x="245" y="250" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[2:2]</text>
  </g>

  <!-- Temporal Unit 4 (tId=0 again) -->
  <g id="tu4-input">
    <text x="30" y="285" font-family="Arial, sans-serif" font-size="10" fill="#666">TU 4 (t=0):</text>

    <rect x="100" y="270" width="30" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
    <text x="115" y="285" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

    <rect x="135" y="270" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="155" y="285" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[0:0]</text>

    <rect x="180" y="270" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="200" y="285" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[1:0]</text>

    <rect x="225" y="270" width="40" height="24" fill="#66bb6a" stroke="#d32f2f" stroke-width="2" stroke-dasharray="3,2" rx="2"/>
    <text x="245" y="285" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[2:0]</text>
  </g>

  <!-- Arrow and extraction box -->
  <line x1="250" y1="310" x2="250" y2="340" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="100" y="340" width="300" height="130" fill="#fff3e0" stroke="#ff6f00" stroke-width="2.5" rx="5"/>
  <text x="250" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#e65100">
    Singlestream Extraction
  </text>
  <text x="250" y="385" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">
    Local Operating Point Selected:
  </text>
  <rect x="120" y="395" width="260" height="65" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
  <text x="250" y="412" font-family="Courier, monospace" font-size="9" text-anchor="middle" fill="#333">
    ops_mlayer_map[0][opsId][opIdx][0] = 0x03
  </text>
  <text x="250" y="427" font-family="Courier, monospace" font-size="9" text-anchor="middle" fill="#333">
    ops_tlayer_map[0][opsId][opIdx][0][0] = 0x03
  </text>
  <text x="250" y="442" font-family="Courier, monospace" font-size="9" text-anchor="middle" fill="#333">
    ops_tlayer_map[0][opsId][opIdx][0][1] = 0x03
  </text>
  <text x="250" y="457" font-family="Arial, sans-serif" font-size="8" font-style="italic" text-anchor="middle" fill="#666">
    (Retain: mId=0,1 and tId=0,1 for both)
  </text>

  <line x1="250" y1="480" x2="250" y2="510" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Output Bitstream -->
  <text x="20" y="535" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b5e20">
    Output Sub-bitstream:
  </text>

  <!-- TU 1 output -->
  <g id="tu1-output">
    <text x="30" y="560" font-family="Arial, sans-serif" font-size="10" fill="#666">TU 1 (t=0):</text>

    <rect x="100" y="545" width="30" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
    <text x="115" y="560" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

    <rect x="135" y="545" width="38" height="24" fill="#5c6bc0" stroke="#3949ab" stroke-width="1" rx="2"/>
    <text x="154" y="560" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">LCR</text>

    <rect x="178" y="545" width="38" height="24" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="2"/>
    <text x="197" y="560" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">OPS</text>

    <rect x="221" y="545" width="35" height="24" fill="#26a69a" stroke="#00897b" stroke-width="1" rx="2"/>
    <text x="238" y="560" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">SH</text>

    <rect x="261" y="545" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="281" y="560" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[0:0]</text>

    <rect x="306" y="545" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="326" y="560" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[1:0]</text>
  </g>

  <!-- TU 2 output -->
  <g id="tu2-output">
    <text x="30" y="595" font-family="Arial, sans-serif" font-size="10" fill="#666">TU 2 (t=1):</text>

    <rect x="100" y="580" width="30" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
    <text x="115" y="595" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

    <rect x="135" y="580" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="155" y="595" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[0:1]</text>

    <rect x="180" y="580" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="200" y="595" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[1:1]</text>
  </g>

  <!-- TU 3 removed -->

  <!-- TU 4 output -->
  <g id="tu4-output">
    <text x="30" y="630" font-family="Arial, sans-serif" font-size="10" fill="#666">TU 4 (t=0):</text>

    <rect x="100" y="615" width="30" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
    <text x="115" y="630" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

    <rect x="135" y="615" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="155" y="630" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[0:0]</text>

    <rect x="180" y="615" width="40" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1.5" rx="2"/>
    <text x="200" y="630" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">[1:0]</text>
  </g>

  <!-- Annotations -->
  <g id="annotations">
    <rect x="550" y="150" width="430" height="490" fill="#f9f9f9" stroke="#ccc" stroke-width="1" rx="4"/>

    <text x="765" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">
      Key Points
    </text>

    <text x="565" y="205" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
      Input Bitstream:
    </text>
    <text x="575" y="223" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • Single extended layer (xId=0 implicit)
    </text>
    <text x="575" y="238" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • 3 embedded layers (mId: 0, 1, 2)
    </text>
    <text x="575" y="253" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • 3 temporal layers (tId: 0, 1, 2)
    </text>
    <text x="575" y="268" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • TU 1: Contains tId=0 frames
    </text>
    <text x="575" y="283" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • TU 2: Contains tId=1 frames
    </text>
    <text x="575" y="298" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • TU 3: Contains tId=2 frames
    </text>
    <text x="575" y="313" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • TU 4: Contains tId=0 frames
    </text>

    <text x="565" y="343" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
      OBU Ordering per TU:
    </text>
    <text x="575" y="361" font-family="Arial, sans-serif" font-size="9" fill="#333">
      1. Temporal Delimiter (TD)
    </text>
    <text x="575" y="376" font-family="Arial, sans-serif" font-size="9" fill="#333">
      2. Local LCR (first TU only)
    </text>
    <text x="575" y="391" font-family="Arial, sans-serif" font-size="9" fill="#333">
      3. Local OPS (optional, first TU only)
    </text>
    <text x="575" y="406" font-family="Arial, sans-serif" font-size="9" fill="#333">
      4. Sequence Header (first TU only)
    </text>
    <text x="575" y="421" font-family="Arial, sans-serif" font-size="9" fill="#333">
      5. Frames (all embedded layers with
    </text>
    <text x="585" y="436" font-family="Arial, sans-serif" font-size="9" fill="#333">
      same temporal layer)
    </text>

    <text x="565" y="465" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0d47a1">
      Extraction Process:
    </text>
    <text x="575" y="483" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • Uses local OPS (ops_id[0])
    </text>
    <text x="575" y="498" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • Selects embedded layers 0 and 1
    </text>
    <text x="575" y="513" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • Selects temporal layers 0 and 1
    </text>
    <text x="575" y="528" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • All OBUs from single xId=0
    </text>

    <text x="565" y="555" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#1b5e20">
      Output Result:
    </text>
    <text x="575" y="573" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • TU 3 completely removed (tId=2)
    </text>
    <text x="575" y="588" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • Only frames with mId=0 or mId=1
    </text>
    <text x="575" y="603" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • Only frames with tId=0 or tId=1
    </text>
    <text x="575" y="618" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • All TDs preserved
    </text>
    <text x="575" y="633" font-family="Arial, sans-serif" font-size="9" fill="#333">
      • LCR, OPS, SH preserved (mId=0, tId=0)
    </text>
  </g>

  <!-- Bottom note -->
  <text x="300" y="675" font-family="Arial, sans-serif" font-size="9" fill="#666">
    Note: Singlestream has single extended layer. Frames in same TU have same temporal layer ID.
  </text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
