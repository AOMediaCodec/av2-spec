<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 605" width="1100" height="605">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="25" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">
    Temporally Non-Aligned Multistream — Independent Local Temporal Units (lcr_enforce_tu_alignment_flag = 0)
  </text>

  <!-- Legend -->
  <g id="legend">
    <rect x="20" y="40" width="1060" height="50" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3"/>
    <text x="30" y="58" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Legend:</text>

    <rect x="30" y="66" width="35" height="16" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
    <text x="70" y="78" font-family="Arial, sans-serif" font-size="9" fill="#333">TD</text>

    <rect x="100" y="66" width="35" height="16" fill="#ef5350" stroke="#c62828" stroke-width="1" rx="2"/>
    <text x="140" y="78" font-family="Arial, sans-serif" font-size="9" fill="#333">MSDO</text>

    <rect x="190" y="66" width="35" height="16" fill="#7e57c2" stroke="#512da8" stroke-width="1" rx="2"/>
    <text x="230" y="78" font-family="Arial, sans-serif" font-size="9" fill="#333">Global LCR</text>

    <rect x="305" y="66" width="35" height="16" fill="#ab47bc" stroke="#7b1fa2" stroke-width="1" rx="2"/>
    <text x="345" y="78" font-family="Arial, sans-serif" font-size="9" fill="#333">Global OPS</text>

    <rect x="425" y="66" width="35" height="16" fill="#26a69a" stroke="#00897b" stroke-width="1" rx="2"/>
    <text x="465" y="78" font-family="Arial, sans-serif" font-size="9" fill="#333">SH</text>

    <rect x="515" y="66" width="35" height="16" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="2"/>
    <text x="555" y="78" font-family="Arial, sans-serif" font-size="9" fill="#333">Local OPS</text>

    <rect x="625" y="66" width="35" height="16" fill="#66bb6a" stroke="#388e3c" stroke-width="1" rx="2"/>
    <text x="665" y="78" font-family="Arial, sans-serif" font-size="9" fill="#333">Frame(xId:0)</text>

    <rect x="745" y="66" width="35" height="16" fill="#ffa726" stroke="#f57c00" stroke-width="1" rx="2"/>
    <text x="785" y="78" font-family="Arial, sans-serif" font-size="9" fill="#333">Frame(xId:1)</text>

    <rect x="855" y="66" width="90" height="16" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="8,4" rx="2"/>
    <text x="950" y="78" font-family="Arial, sans-serif" font-size="9" fill="#333">Local TU boundary</text>
  </g>

  <!-- Time axis -->
  <line x1="50" y1="108" x2="1070" y2="108" stroke="#999" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="1075" y="112" font-family="Arial, sans-serif" font-size="9" fill="#666">Bitstream order</text>

  <!-- Global OBUs section (at the start) -->
  <rect x="30" y="120" width="200" height="60" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5" rx="4"/>
  <text x="40" y="137" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#283593">Global OBUs</text>

  <rect x="40" y="145" width="35" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
  <text x="57" y="160" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">G-TD</text>

  <rect x="80" y="145" width="42" height="24" fill="#ef5350" stroke="#c62828" stroke-width="1" rx="2"/>
  <text x="101" y="160" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">MSDO</text>

  <rect x="127" y="145" width="42" height="24" fill="#7e57c2" stroke="#512da8" stroke-width="1" rx="2"/>
  <text x="148" y="160" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">G-LCR</text>

  <rect x="174" y="145" width="42" height="24" fill="#ab47bc" stroke="#7b1fa2" stroke-width="1" rx="2"/>
  <text x="195" y="160" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">G-OPS</text>

  <!-- Extended Layer 0 row -->
  <text x="30" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">Extended Layer 0 (obu_xlayer_id = 0)</text>

  <!-- Local TU 0-A (Extended Layer 0) -->
  <rect x="30" y="225" width="290" height="80" fill="#e8f5e9" stroke="#1565c0" stroke-width="2" rx="5" stroke-dasharray="8,4"/>
  <text x="40" y="242" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1565c0">Local TU (OrderHint = 0)</text>

  <rect x="40" y="250" width="35" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
  <text x="57" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

  <rect x="80" y="250" width="32" height="24" fill="#26a69a" stroke="#00897b" stroke-width="1" rx="2"/>
  <text x="96" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">SH</text>

  <rect x="117" y="250" width="32" height="24" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="2"/>
  <text x="133" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">OPS</text>

  <rect x="160" y="250" width="65" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1" rx="2"/>
  <text x="192" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Frame [0:0:0]</text>

  <rect x="230" y="250" width="75" height="24" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5" rx="2"/>
  <text x="267" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" font-weight="bold">Output [0:0:0]</text>

  <!-- Local TU 0-B (Extended Layer 0) -->
  <rect x="335" y="225" width="260" height="80" fill="#e8f5e9" stroke="#1565c0" stroke-width="2" rx="5" stroke-dasharray="8,4"/>
  <text x="345" y="242" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1565c0">Local TU (OrderHint = 1)</text>

  <rect x="345" y="250" width="35" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
  <text x="362" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

  <rect x="390" y="250" width="65" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1" rx="2"/>
  <text x="422" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Frame [0:0:1]</text>

  <rect x="460" y="250" width="75" height="24" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5" rx="2"/>
  <text x="497" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" font-weight="bold">Output [0:0:1]</text>

  <!-- Local TU 0-C (Extended Layer 0) -->
  <rect x="610" y="225" width="260" height="80" fill="#e8f5e9" stroke="#1565c0" stroke-width="2" rx="5" stroke-dasharray="8,4"/>
  <text x="620" y="242" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1565c0">Local TU (OrderHint = 2)</text>

  <rect x="620" y="250" width="35" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
  <text x="637" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

  <rect x="665" y="250" width="65" height="24" fill="#66bb6a" stroke="#388e3c" stroke-width="1" rx="2"/>
  <text x="697" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Frame [0:0:2]</text>

  <rect x="735" y="250" width="75" height="24" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5" rx="2"/>
  <text x="772" y="265" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" font-weight="bold">Output [0:0:2]</text>

  <text x="890" y="265" font-family="Arial, sans-serif" font-size="14" fill="#1b5e20">. . .</text>

  <!-- Extended Layer 1 row -->
  <text x="30" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e65100">Extended Layer 1 (obu_xlayer_id = 1)</text>

  <!-- Local TU 1-A (Extended Layer 1) — note different timing! -->
  <rect x="30" y="350" width="350" height="80" fill="#fff3e0" stroke="#1565c0" stroke-width="2" rx="5" stroke-dasharray="8,4"/>
  <text x="40" y="367" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1565c0">Local TU (OrderHint = 0)</text>

  <rect x="40" y="375" width="35" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
  <text x="57" y="390" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

  <rect x="80" y="375" width="32" height="24" fill="#26a69a" stroke="#00897b" stroke-width="1" rx="2"/>
  <text x="96" y="390" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">SH</text>

  <rect x="117" y="375" width="32" height="24" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="2"/>
  <text x="133" y="390" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">OPS</text>

  <rect x="160" y="375" width="65" height="24" fill="#ffa726" stroke="#f57c00" stroke-width="1" rx="2"/>
  <text x="192" y="390" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Frame [1:0:0]</text>

  <rect x="230" y="375" width="65" height="24" fill="#ffa726" stroke="#f57c00" stroke-width="1" rx="2"/>
  <text x="262" y="390" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Frame [1:1:0]</text>

  <rect x="300" y="375" width="65" height="24" fill="#e65100" stroke="#bf360c" stroke-width="1.5" rx="2"/>
  <text x="332" y="390" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" font-weight="bold">Output [1:0:0]</text>

  <!-- Local TU 1-B (Extended Layer 1) — different from layer 0 timing -->
  <rect x="400" y="350" width="310" height="80" fill="#fff3e0" stroke="#1565c0" stroke-width="2" rx="5" stroke-dasharray="8,4"/>
  <text x="410" y="367" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1565c0">Local TU (OrderHint = 1)</text>

  <rect x="410" y="375" width="35" height="24" fill="#9e9e9e" stroke="#666" stroke-width="1" rx="2"/>
  <text x="427" y="390" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">TD</text>

  <rect x="455" y="375" width="65" height="24" fill="#ffa726" stroke="#f57c00" stroke-width="1" rx="2"/>
  <text x="487" y="390" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Frame [1:0:1]</text>

  <rect x="525" y="375" width="65" height="24" fill="#ffa726" stroke="#f57c00" stroke-width="1" rx="2"/>
  <text x="557" y="390" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white">Frame [1:1:1]</text>

  <rect x="595" y="375" width="65" height="24" fill="#e65100" stroke="#bf360c" stroke-width="1.5" rx="2"/>
  <text x="627" y="390" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" font-weight="bold">Output [1:0:1]</text>

  <text x="740" y="390" font-family="Arial, sans-serif" font-size="14" fill="#e65100">. . .</text>

  <!-- Annotation: non-alignment -->
  <line x1="305" y1="300" x2="305" y2="345" stroke="#d32f2f" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="370" y1="300" x2="370" y2="345" stroke="#d32f2f" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="337" y="330" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#d32f2f" font-weight="bold">not</text>
  <text x="337" y="340" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#d32f2f" font-weight="bold">aligned</text>

  <!-- Constraints box -->
  <rect x="20" y="450" width="1060" height="55" fill="#fff8e1" stroke="#ffa000" stroke-width="1" rx="3"/>
  <text x="35" y="467" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#e65100">Non-aligned mode constraints:</text>
  <text x="35" y="481" font-family="Arial, sans-serif" font-size="8" fill="#333">• Local temporal units from different extended layers are NOT required to be temporally aligned  •  A global temporal unit is not defined in this mode</text>
  <text x="35" y="494" font-family="Arial, sans-serif" font-size="8" fill="#333">• Extended layers do not need ascending obu_xlayer_id order, but their order shall not change within a coded multistream video sequence</text>

  <!-- Key difference annotation -->
  <rect x="20" y="515" width="1060" height="82" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" rx="3"/>
  <text x="35" y="532" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0d47a1">Key characteristics of non-aligned mode:</text>
  <text x="35" y="547" font-family="Arial, sans-serif" font-size="8" fill="#333">• Each extended layer's local temporal units are independently identifiable by their obu_xlayer_id value</text>
  <text x="35" y="561" font-family="Arial, sans-serif" font-size="8" fill="#333">• OrderHint values across different extended layers may differ for the same bitstream position</text>
  <text x="35" y="575" font-family="Arial, sans-serif" font-size="8" fill="#333">• Extended layers may have different numbers of temporal units and different temporal structures</text>
  <text x="35" y="589" font-family="Arial, sans-serif" font-size="8" fill="#333">• All extended layers shall reference the same activated global LCR (same lcr_global_config_record_id)</text>
</svg>
