name: Clarification Request
description: Ask questions about interpretation or implementation guidance
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        For questions about interpretation or implementation guidance.

        Please check the [Release Notes](https://github.com/AOMediaCodec/av2-spec#release-notes) for known issues first, and search existing issues to avoid duplicates.

  - type: input
    id: section
    attributes:
      label: Section/Topic
      description: Which part of the specification?
      placeholder: 'e.g., Section 7.4, Motion Vector Prediction, Annex E'
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to implement or understand?
      placeholder: Describe what you're working on and why you need clarification
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What specifically is unclear?
      placeholder: Ask your specific question
    validations:
      required: true

  - type: checkboxes
    id: checked
    attributes:
      label: What I've Checked
      description: Where have you already looked?
      options:
        - label: Release Notes
        - label: Related sections of the spec
        - label: Existing GitHub issues
        - label: Reference software (AVM)

  - type: textarea
    id: why-unclear
    attributes:
      label: Why It's Unclear
      description: What specifically causes confusion or ambiguity?
      placeholder: Help us understand what part is confusing so we can improve the specification
    validations:
      required: true
